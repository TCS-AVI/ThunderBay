<style>
:root{--bg:#f8f4f4;--sf:#fff;--tx:#231416;--mu:#6f565b;--ln:#e8dadc;--ac:#c8102e;--ac2:#fbe8eb;--or:#d80621;--gr:#1e7b3a;--wa:#b86e00;--bad:#b3261e;--ok:#2e7d4f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f11;--sf:#211719;--tx:#f7ecee;--mu:#b9a3a8;--ln:#3c2a2e;--ac:#ff6b7d;--ac2:#3a1a21;--or:#ff4d5e;--gr:#5fd08a;--wa:#f0b04a;--bad:#ff8a80;--ok:#7fd9a0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150f11;--sf:#211719;--tx:#f7ecee;--mu:#b9a3a8;--ln:#3c2a2e;--ac:#ff6b7d;--ac2:#3a1a21;--or:#ff4d5e;--gr:#5fd08a;--wa:#f0b04a;--bad:#ff8a80;--ok:#7fd9a0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:calc(16px*var(--fs,1))/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;padding-bottom:80px}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font:700 calc(22px*var(--fs,1))/1.2 Georgia,"Times New Roman",serif;margin:6px 0 2px}
h2{font:700 calc(17px*var(--fs,1)) Georgia,serif;margin:20px 0 8px}
.sub{color:var(--mu);font-size:calc(14px*var(--fs,1));margin:0 0 12px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
input,select,button{font:inherit;color:var(--tx)}
input,select{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:9px;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button{background:var(--ac);color:var(--bg);border:0;border-radius:8px;padding:10px 14px;font-weight:600;cursor:pointer}
button.g{background:var(--ac2);color:var(--ac)}button.x{background:none;color:var(--bad);padding:6px}
.big{font-size:calc(28px*var(--fs,1));width:100%;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:var(--ac2);color:var(--ac);border:1px solid transparent;padding:8px 11px;border-radius:20px;font-weight:600;font-size:calc(14px*var(--fs,1))}
.chip.on{background:var(--ac);color:var(--bg)}
.bar{height:10px;background:var(--ln);border-radius:5px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.w i{background:var(--wa)}.bar.b i{background:var(--bad)}
.mu{color:var(--mu);font-size:calc(13px*var(--fs,1))}.bad{color:var(--bad)}.ok{color:var(--ok)}
.alert{border-left:4px solid var(--wa);background:var(--sf);padding:10px 12px;border-radius:8px;margin-bottom:8px}
.alert.b{border-color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:12px 2px;font-size:calc(13px*var(--fs,1))}
nav button.on{color:var(--ac);box-shadow:inset 0 3px var(--or)}
#toast{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:12px;border-radius:10px;display:none;z-index:9;max-width:616px;margin:0 auto}
.num{width:90px}.sm{width:60px}
.seg{background:var(--ac2);height:14px;display:flex;border-radius:7px;overflow:hidden;margin:8px 0}
.seg i{display:block;height:100%}
h1{color:var(--ac)}
.strip{height:5px;background:linear-gradient(90deg,var(--or) 0 25%,#fff 25% 75%,var(--or) 75%);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:12px;margin:4px 0 14px}.brand img{width:68px;height:68px;flex:none}.brand b{font:700 calc(21px*var(--fs,1))/1.15 Georgia,"Times New Roman",serif;color:var(--ac)}.brand span{color:var(--mu);font-size:calc(13px*var(--fs,1))}
.inst{display:none;position:sticky;top:0;z-index:8;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;background:var(--sf);border-bottom:1px solid var(--ln)}
.inst.on{display:flex}.inst span{flex:1 1 180px;font-size:calc(14px*var(--fs,1))}
.sheet{display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);align-items:flex-end;justify-content:center;padding:12px}
.sheet.on{display:flex}.sheet>div{width:100%;max-width:520px;margin:0}
.sheet ol{padding-left:20px;margin:8px 0}.sheet li{margin-bottom:6px}
.skip{position:absolute;left:-999px;top:0;background:var(--ac);color:var(--bg);padding:10px;z-index:30}.skip:focus{left:8px;top:8px}
.foot{max-width:640px;margin:0 auto;padding:6px 14px 14px;color:var(--mu);font-size:calc(13px*var(--fs,1))}
.foot p{margin:4px 0}.foot a,.foot button.lk{background:none;color:var(--ac);padding:6px 8px 6px 0;text-decoration:underline;font-weight:600;font-size:inherit;border-radius:4px}
.sheet>div{max-height:88vh;overflow:auto}
.sheet p{margin:8px 0}.pf{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0}.pf label{flex:1}.pf input[type=checkbox]{width:24px;height:24px}
html.sp body{letter-spacing:.03em;word-spacing:.12em;line-height:1.75}
html.f-sans body,html.f-sans h1,html.f-sans h2,html.f-sans .brand b{font-family:Verdana,Tahoma,"Trebuchet MS",Arial,sans-serif}
html.f-serif body{font-family:Georgia,"Times New Roman",serif}
html.tt button,html.tt input,html.tt select{min-height:48px}
html.cb.cb{--ok:#0072b2;--bad:#b84a00;--wa:#8a5a00}
html.cb.cb.dk{--ok:#56b4e9;--bad:#ff9a5c;--wa:#f0e442}
html.hc.hc{--bg:#fff;--sf:#fff;--tx:#000;--mu:#1a1a1a;--ln:#000;--ac:#a50019;--ac2:#f0f0f0;--or:#a50019}
html.hc.hc.dk{--bg:#000;--sf:#000;--tx:#fff;--mu:#f0f0f0;--ln:#fff;--ac:#ffe066;--ac2:#1a1a1a;--or:#ffe066}
html.hc .card,html.hc input,html.hc select{border-width:2px}

var CATS=['Groceries','Thunder Bay Shopping','Online Shopping','Medical/Health','Fuel & Vehicle','Kids & School'];
var DEF={income:0,savePct:10,members:['Me','Partner','Kid 1'],
caps:{'Groceries':600,'Thunder Bay Shopping':200,'Online Shopping':150,'Medical/Health':100,'Fuel & Vehicle':250,'Kids & School':150},
tx:[],paid:{},
bills:[{n:'Rent',a:1,d:1,m:0},{n:'Heating / gas',a:1,d:5,m:0},{n:'Water',a:1,d:10,m:0},{n:'Hydro',a:1,d:12,m:0},{n:'Subscriptions',a:1,d:15,m:0},

funds:[{n:'Christmas gifts',who:'Kid 1',goal:150,saved:0}],iou:[],yearly:[],al:2,rem:[],shop:[],inc:[],reg:{RRSP:{room:0,paid:0},TFSA:{room:0,paid:0},FHSA:{room:0,paid:0},RESP:{room:0,paid:0}}};
var S=JSON.parse(JSON.stringify(DEF)),KEY=null,SALT=null,SP=Promise.resolve();var tab='home',cat=CATS[0],who='',curFund=0;
function load(){try{var r=localStorage.getItem('tbayLedger');if(r)return Object.assign({},DEF,JSON.parse(r))}catch(e){}return JSON.parse(JSON.stringify(DEF))}
function save(){if(!KEY)return;var snap=JSON.stringify(S);SP=SP.then(function(){return enc(snap)}).then(function(v){try{localStorage.setItem('tbayVault',v)}catch(e){}}).catch(function(){})}
function ym(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function today(){var d=new Date();return ym(d)+'-'+String(d.getDate()).padStart(2,'0')}
function $c(n){return '$'+(Number(n)||0).toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var RM=null;function cm(){return RM||ym()}
function spent(c){return S.tx.filter(function(t){return t.d.slice(0,7)==cm()&&(!c||t.c==c)}).reduce(function(s,t){return s+t.a},0)}
function pct(c){var cap=S.caps[c]||0;return cap?spent(c)/cap*100:0}
function cls(p){return p>=100?'b':p>=80?'w':''}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},4500)}
function notify(m){toast(m);try{if('Notification' in window&&Notification.permission=='granted')new Notification('Budget alert',{body:'A spending cap needs your attention.'})}catch(e){}}
function bar(p){return '<div class="bar '+cls(p)+'"><i style="width:'+Math.min(100,p)+'%"></i></div>'}
function go(t){tab=t;render()}
function pick(c){cat=c;render()}
function pickWho(w){who=who==w?'':w;render()}
function addTx(){
 var a=parseFloat(document.getElementById('amt').value);
 if(!(a>0)){toast('Enter an amount greater than zero.');return}
 var note=document.getElementById('note').value;
 var before=pct(cat);
 var sp=document.getElementById('sp').value;
 if(sp){var tot=a;a=Math.round(a/2*100)/100;note=(note?note+' · ':'')+'split with '+sp+' (total '+$c(tot)+')';S.iou.push({id:Date.now()+1,dir:'lent',n:sp,a:Math.round((tot-a)*100)/100,d:today(),due:'',plan:'Half of '+cat,mp:0,done:false})}
 var tg=document.getElementById('ctag').value||(cat=='Medical/Health'?'Medical':'');
 S.tx.push({id:Date.now(),d:today(),c:cat,a:a,n:note,w:who,h:document.getElementById('hst').checked,g:tg});save();
 var p=pct(cat),cap=S.caps[cat]||0;
 if(cap&&p>=100)notify(cat+': over the '+$c(cap)+' cap ('+$c(spent(cat))+' spent).');
 else if(cap&&p>=80&&before<80)notify(cat+' is at '+Math.round(p)+'% of its cap.');
 else toast('Added '+$c(a)+' to '+cat+'.');
 render()}
function delTx(id){S.tx=S.tx.filter(function(t){return t.id!=id});save();render()}
function setCap(c,v){S.caps[c]=parseFloat(v)||0;save();render()}
function setF(k,v){S[k]=parseFloat(v)||0;save();render()}
function addMember(){var n=document.getElementById('mem').value.trim();if(n&&S.members.indexOf(n)<0){S.members.push(n);save();render()}}
function delMember(i){S.members.splice(i,1);save();render()}
function setBill(i,k,v){S.bills[i][k]=k=='n'?v:(parseFloat(v)||0);save();render()}
function togglePaid(i){var k=ym()+':'+i;S.paid[k]=!S.paid[k];save();render()}
function addBill(){S.bills.push({n:'New bill',a:1,d:1,m:0});save();render()}
function delBill(i){S.bills.splice(i,1);S.paid={};save();render()}
function addFund(){var n=document.getElementById('fn').value.trim();if(!n)return;S.funds.push({n:n,who:document.getElementById('fw').value,goal:parseFloat(document.getElementById('fg').value)||0,saved:0});save();render()}
function contrib(i){var el=document.getElementById('fc'+i);var v=parseFloat(el.value);if(v){S.funds[i].saved+=v;save();render()}}
function delFund(i){S.funds.splice(i,1);save();render()}
function addIou(){
 var n=document.getElementById('in').value.trim(),a=parseFloat(document.getElementById('ia').value);
 if(!n||!(a>0)){toast('Add a name and an amount.');return}
 S.iou.push({id:Date.now(),dir:document.getElementById('id').value,n:n,a:a,d:today(),due:document.getElementById('iu').value,plan:document.getElementById('ip').value,mp:parseFloat(document.getElementById('im').value)||0,done:false});save();render()}
function settle(id){S.iou.forEach(function(x){if(x.id==id)x.done=!x.done});save();render()}
function delIou(id){S.iou=S.iou.filter(function(x){return x.id!=id});save();render()}
function askNotify(){try{Notification.requestPermission().then(function(){toast('Phone alerts: '+Notification.permission+'.')})}catch(e){toast('This browser can’t show phone alerts. In-app alerts still work.')}}
function yearlyTotal(){return (S.yearly||[]).reduce(function(s,y){return s+y.a/12},0)}
function yearlyUI(){
 var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
 return '<h2>Yearly bills</h2><p class="mu" style="margin:-4px 0 8px">Set aside a twelfth each month so renewals never surprise you.</p>'+(S.yearly||[]).map(function(y,i){return '<div class="card"><div class="row sp"><b>'+esc(y.n)+'</b><b>'+$c(y.a/12)+'/mo</b></div><div class="mu">'+$c(y.a)+' due in '+M[y.m-1]+'</div><button class="x" onclick="delYear('+i+')">Remove</button></div>'}).join('')+'<div class="card row"><input id="yn" placeholder="e.g. Car insurance, licence" style="flex:1 1 100%"><input id="ya" class="num" type="number" placeholder="Yearly $"><select id="ymo">'+M.map(function(n,i){return '<option value="'+(i+1)+'">'+n+'</option>'}).join('')+'</select><button onclick="addYear()">Add</button></div>'}
function addYear(){var n=document.getElementById('yn').value.trim(),a=parseFloat(document.getElementById('ya').value);if(!n||!(a>0)){toast('Add a name and a yearly amount.');return}S.yearly.push({n:n,a:a,m:parseInt(document.getElementById('ymo').value)});save();render()}
function delYear(i){S.yearly.splice(i,1);save();render()}
function trendUI(){var now=new Date(),ms=[];for(var i=5;i>=0;i--)ms.push(ym(new Date(now.getFullYear(),now.getMonth()-i,1)));var tt=ms.map(function(m){return S.tx.filter(function(t){return t.d.slice(0,7)==m}).reduce(function(s,t){return s+t.a},0)});var mx=Math.max.apply(null,tt.concat([1]));return '<h2>Six-month trend</h2><div class="card">'+ms.map(function(m,i){return '<div class="row" style="margin-bottom:6px;flex-wrap:nowrap"><span class="mu" style="width:62px">'+m+'</span><div class="bar" style="flex:1;margin:0"><i style="width:'+tt[i]/mx*100+'%;background:var(--ac)"></i></div><b style="width:92px;text-align:right">'+$c(tt[i])+'</b></div>'}).join('')+'</div>'}
function remUI(){var l=(S.rem||[]).slice().sort(function(a,b){return a.d<b.d?-1:1});return '<h2>Reminders</h2><p class="mu" style="margin:-4px 0 8px">School payments, forms and appointments. They appear on the Log tab 3 days before.</p>'+l.map(function(r){return '<div class="card"><div class="row sp"><b style="'+(r.done?'text-decoration:line-through':'')+'">'+esc(r.t)+'</b><span class="mu">'+r.d+'</span></div><div class="row" style="margin-top:6px"><button class="'+(r.done?'':'g')+'" onclick="togRem('+r.id+')">'+(r.done?'Done':'Mark done')+'</button><button class="x" onclick="delRem('+r.id+')">Delete</button></div></div>'}).join('')+'<div class="card row"><input id="rt" placeholder="e.g. School Cash Online: field trip" style="flex:1 1 100%"><input id="rd" type="date"><button onclick="addRem()">Add reminder</button></div>'}
function addRem(){var t=g('rt').value.trim(),d=g('rd').value;if(!t||!d){toast('Add a reminder and a date.');return}S.rem=S.rem||[];S.rem.push({id:Date.now(),t:t,d:d,done:false});save();render()}
function togRem(id){S.rem.forEach(function(r){if(r.id==id)r.done=!r.done});save();render()}
function delRem(id){S.rem=S.rem.filter(function(r){return r.id!=id});save();render()}
function shopUI(){var l=S.shop||[],est=l.filter(function(x){return !x.done}).reduce(function(s,x){return s+x.p},0),left=Math.max(0,(S.caps['Groceries']||0)-spent('Groceries'));return '<h2>Shopping list</h2><div class="card"><div class="row sp"><span>Estimated total</span><b>'+$c(est)+'</b></div><div class="mu">Groceries envelope left: '+$c(left)+(est>left?' <span class="bad">The list is over what is left.</span>':'')+'</div></div>'+l.map(function(x){return '<div class="card row sp"><label style="flex:1"><input type="checkbox"'+(x.done?' checked':'')+' onchange="togShop('+x.id+')"> <span style="'+(x.done?'text-decoration:line-through':'')+'">'+esc(x.t)+'</span></label><span class="mu">'+$c(x.p)+'</span><button class="x" onclick="delShop('+x.id+')">Remove</button></div>'}).join('')+'<div class="card row"><input id="st" placeholder="Item" style="flex:1"><input id="sp2" class="num" type="number" placeholder="Est. $"><button onclick="addShop()">Add</button></div>'}
function addShop(){var t=g('st').value.trim();if(!t){toast('Type an item first.');return}S.shop=S.shop||[];S.shop.push({id:Date.now(),t:t,p:parseFloat(g('sp2').value)||0,done:false});save();render()}
function togShop(id){S.shop.forEach(function(x){if(x.id==id)x.done=!x.done});save();render()}
function delShop(id){S.shop=S.shop.filter(function(x){return x.id!=id});save();render()}
var SRC=['Canada Child Benefit','GST/HST credit','Ontario Trillium Benefit','Tax refund','Other'];
function otherInc(){return (S.inc||[]).filter(function(x){return x.d.slice(0,7)==ym()}).reduce(function(s,x){return s+x.a},0)}
function incUI(){var l=(S.inc||[]).filter(function(x){return x.d.slice(0,7)==ym()}).sort(function(a,b){return a.d<b.d?1:-1});return '<h2>Other income</h2><p class="mu" style="margin:-4px 0 8px">Benefits, refunds and anything else that lands outside your salary. Counted in this month plan.</p>'+l.map(function(x){return '<div class="card row sp"><div><b>'+$c(x.a)+'</b> '+esc(x.src)+'<div class="mu">'+x.d+'</div></div><button class="x" onclick="delInc('+x.id+')">Delete</button></div>'}).join('')+'<div class="card row"><select id="isrc">'+SRC.map(function(s){return '<option>'+s+'</option>'}).join('')+'</select><input id="iamt" class="num" type="number" inputmode="decimal" placeholder="$"><input id="idt" type="date" value="'+today()+'"><button onclick="addInc()">Add income</button></div>'}
function addInc(){var a=parseFloat(g('iamt').value),d=g('idt').value;if(!(a>0)||!d){toast('Add an amount and a date.');return}S.inc=S.inc||[];S.inc.push({id:Date.now(),d:d,src:g('isrc').value,a:a});save();toast('Added '+$c(a)+' of '+g('isrc').value+'.');render()}
function delInc(id){S.inc=S.inc.filter(function(x){return x.id!=id});save();render()}
function fixedTotal(){return S.bills.reduce(function(s,b){return s+b.m},0)}
function capTotal(){return CATS.reduce(function(s,c){return s+(S.caps[c]||0)},0)}

 var dn=new Date().getDate();
 var td=today(),d3=new Date(Date.now()+3*864e5),t3=ym(d3)+'-'+String(d3.getDate()).padStart(2,'0');
 (S.rem||[]).forEach(function(r){if(!r.done&&r.d<=t3)h+='<div class="alert'+(r.d<td?' b':'')+'"><b>'+esc(r.t)+'</b> ('+(r.d<td?'overdue since ':'due ')+r.d+')</div>'});

 var rem=CATS.reduce(function(s,c){return s+Math.max(0,(S.caps[c]||0)-spent(c))},0),nd=new Date(),dl=new Date(nd.getFullYear(),nd.getMonth()+1,0).getDate()-nd.getDate()+1;
 h+='<div class="card row sp"><div><b>Safe to spend today</b><div class="mu">'+$c(rem)+' left across envelopes, '+dl+' days to go</div></div><b style="font-size:calc(22px*var(--fs,1))">'+$c(rem/dl)+'</b></div>';

 h+='<div class="chips">'+CATS.map(function(c){return '<button class="chip'+(c==cat?' on':'')+'" onclick="pick(\''+c.replace(/'/g,"\\'")+'\')">'+c+'</button>'}).join('')+'</div>';
 h+='<div class="chips">'+S.members.map(function(m){return '<button class="chip'+(m==who?' on':'')+'" onclick="pickWho(\''+esc(m).replace(/'/g,"\\'")+'\')">'+esc(m)+'</button>'}).join('')+'</div>';
 h+='<div class="row" style="margin-bottom:8px"><label class="mu"><input type="checkbox" id="hst"'+(cat=='Groceries'||cat=='Medical/Health'?'':' checked')+'> Includes 13% HST</label><select id="ctag"><option value="">No CRA tag</option><option>Medical</option><option>Child care</option><option>Donation</option><option>Tuition</option><option>Other deductible</option></select></div>';
 h+='<div class="row" style="margin-bottom:8px"><label class="mu">Split 50/50 with</label><select id="sp"><option value="">No split</option>'+S.members.map(function(m){return '<option>'+esc(m)+'</option>'}).join('')+'</select></div>';
 h+='<div class="row"><input id="note" placeholder="Note (optional)" style="flex:1"><button onclick="addTx()">Add expense</button><button class="g" onclick="repLast()">Repeat last</button></div></div>';
 h+='<h2>Recent</h2>';
 var rec=S.tx.slice(-8).reverse();
 h+=rec.length?rec.map(function(t){return '<div class="card row sp"><div><b>'+$c(t.a)+'</b> '+t.c+'<div class="mu">'+t.d+(t.w?' · '+esc(t.w):'')+(t.n?' · '+esc(t.n):'')+'</div></div><button class="x" aria-label="Delete" onclick="delTx('+t.id+')">Delete</button></div>'}).join(''):'<p class="mu">No expenses yet. Enter an amount above and tap a category.</p>';
 return h}

 h+='<div class="row sp" style="margin-bottom:8px"><label for="nm">Your name (for greetings)</label><input id="nm" value="'+esc(S.name||'')+'" onchange="S.name=this.value.trim();save();render()" style="width:140px"></div>';
 h+='<div class="row sp"><label>Month-end salary</label><input class="num" type="number" value="'+S.income+'" onchange="setF(\'income\',this.value)"></div>';
 h+='<div class="row sp" style="margin-top:8px"><label>Savings (%)</label><input class="num" type="number" value="'+S.savePct+'" onchange="setF(\'savePct\',this.value)"></div>';

  h+='<div class="seg"><i style="width:'+w(fx)+';background:var(--ac)"></i><i style="width:'+w(sv)+';background:var(--ok)"></i><i style="width:'+w(vr)+';background:var(--wa)"></i></div>'}
 h+='<div class="mu">Salary '+$c(S.income)+' · Other income '+$c(oi)+'</div>';

 S.funds.forEach(function(f,i){var p=f.goal?f.saved/f.goal*100:0;h+='<div class="card"><div class="row sp"><b>'+esc(f.n)+'</b><span class="mu">for '+esc(f.who)+'</span></div><div class="bar"><i style="width:'+Math.min(100,p)+'%"></i></div><div class="mu">'+$c(f.saved)+' of '+$c(f.goal)+'</div><div class="row" style="margin-top:6px"><input id="fc'+i+'" class="num" type="number" placeholder="Add $"><button class="g" onclick="contrib('+i+')">Save towards</button><button class="x" onclick="delFund('+i+')">Remove</button></div></div>'});
 h+='<div class="card row"><input id="fn" placeholder="Fund name (e.g. Diwali, birthday)" style="flex:1 1 100%"><select id="fw">'+S.members.map(function(m){return '<option>'+esc(m)+'</option>'}).join('')+'</select><input id="fg" class="num" type="number" placeholder="Goal $"><button onclick="addFund()">Add fund</button></div>';
 h+='<h2>Family members</h2><div class="card"><div class="chips">'+S.members.map(function(m,i){return '<span class="chip">'+esc(m)+' <button class="x" style="padding:0 0 0 6px" aria-label="Remove '+esc(m)+'" onclick="delMember('+i+')">×</button></span>'}).join('')+'</div><div class="row"><input id="mem" placeholder="Add a name" style="flex:1"><button class="g" onclick="addMember()">Add</button></div></div>';
 return h}

 var h='<h1>Lending & borrowing</h1><div class="card"><div class="row sp"><span>Owed to me</span><b class="ok">'+$c(out)+'</b></div><div class="row sp"><span>I owe</span><b class="bad">'+$c(owe)+'</b></div><hr style="border:0;border-top:1px solid var(--ln)"><div class="row sp"><b>Net balance</b><b class="'+(net>=0?'ok':'bad')+'">'+(net>=0?'+':'−')+$c(Math.abs(net))+'</b></div></div>';
 h+='<div class="card row"><select id="id"><option value="lent">I lent</option><option value="owe">I owe</option></select><input id="in" placeholder="Name" style="flex:1"><input id="ia" class="num" type="number" placeholder="$"><label class="mu" style="flex:1 1 100%">Payback / due date</label><input id="iu" type="date"><input id="im" class="num" type="number" placeholder="Monthly $"><input id="ip" placeholder="Payment plan (e.g. $50 per month)" style="flex:1 1 100%"><button onclick="addIou()">Save entry</button></div>';
 [['lent','Money owed to me'],['owe','Money I owe']].forEach(function(g){
  h+='<h2>'+g[1]+'</h2>';var l=S.iou.filter(function(x){return x.dir==g[0]});
  h+=l.length?l.map(function(x){var late=!x.done&&x.due&&x.due<today();return '<div class="card"><div class="row sp"><b>'+esc(x.n)+'</b><b>'+$c(x.a)+'</b></div><div class="mu">'+(g[0]=='lent'?'Lent ':'Since ')+x.d+(x.due?' · due '+x.due:'')+(x.plan?' · '+esc(x.plan):'')+(x.mp&&!x.done?' · about '+Math.ceil(x.a/x.mp)+' months left at '+$c(x.mp)+'/mo':'')+'</div>'+(late?'<div class="bad">Past due</div>':'')+'<div class="row" style="margin-top:6px"><button class="'+(x.done?'':'g')+'" onclick="settle('+x.id+')">'+(x.done?'Settled':'Mark settled')+'</button><button class="x" onclick="delIou('+x.id+')">Delete</button></div></div>'}).join(''):'<p class="mu">Nothing here.</p>'});
 return h}

 h+='<div class="row sp"><b>Total spent</b><b>'+$c(spent())+'</b></div></div>';

 var l=S.tx.filter(function(t){return t.d.slice(0,7)==cm()}).reverse();

function repLast(){var t=S.tx[S.tx.length-1];if(!t){toast("Nothing to repeat yet.");return}S.tx.push({id:Date.now(),d:today(),c:t.c,a:t.a,n:t.n,w:t.w,h:t.h,g:t.g});save();toast('Repeated '+$c(t.a)+' in '+t.c+'.');render()}
function bk(){var el=g('bx');enc(JSON.stringify(S)).then(function(v){el.value=v;el.select();try{navigator.clipboard.writeText(v);toast('Encrypted backup copied.')}catch(e){toast('Select and copy the text to save it.')}})}
function csv(){var el=document.getElementById('bx');el.value='date,category,amount,member,note\n'+S.tx.map(function(t){return [t.d,t.c,t.a,t.w||'','"'+String(t.n||'').replace(/"/g,'""')+'"'].join(',')}).join('\n');el.select()}
function rs(){var o;try{o=JSON.parse(g('bx').value)}catch(e){toast("That text is not a valid backup.");return}
var done=function(d){if(!d.tx||!d.bills)throw 0;S=Object.assign({},JSON.parse(JSON.stringify(DEF)),d);save();toast('Backup restored.');render()};
if(o.c){var pw=g('bp').value;(pw?derive(pw,ub(o.s)):Promise.resolve(KEY)).then(function(k){return dec(o,k)}).then(function(t){done(JSON.parse(t))}).catch(function(){toast('Could not decrypt. If the backup used a different passphrase, type it in the box above.')})}else{try{done(o)}catch(e){toast("That text is not a valid backup.")}}}
function th(){var d=document.documentElement,a=d.getAttribute('data-theme'),dark=a=='dark'||(!a&&matchMedia('(prefers-color-scheme: dark)').matches);d.setAttribute('data-theme',dark?'light':'dark')}

function setReg(k,f,v){S.reg[k][f]=parseFloat(v)||0;save();render()}
function vTax(){
 var now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),yr=now.getFullYear();
 var l=S.tx.filter(function(t){return t.d.slice(0,4)==String(yr)});
